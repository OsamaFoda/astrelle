name: Build

# Checks daily for a new Firefox ESR security release and builds it with our changes.
# Builds of our own changes are started by hand (Actions tab, or `gh workflow run build.yml`),
# since one build takes about three hours and pushes often come in batches. Every build first runs
# the interface tests (tools/test.py) on the newest Astrelle release, a few minutes, so a broken
# change stops there rather than after hours of compiling; `-f tests_only=true` runs just those.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tests_only:
        description: "Only run the interface tests (minutes), no build"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.find.outputs.version }}
      tag: ${{ steps.find.outputs.tag }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source release.env
          # Newest release of our ESR line, from Mozilla's version list.
          VERSION=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json \
            | python3 -c "import json,sys; v=[x for x in json.load(sys.stdin).values() if str(x).startswith('$ESR_MAJOR.')]; print(v[0] if v else '')")
          test -n "$VERSION" || { echo "Mozilla lists no $ESR_MAJOR ESR release" >&2; exit 1; }
          # A hand-started build of our own changes is a new revision of the same Firefox version.
          REV=1
          # (Listed rather than looked up by tag: releases start as drafts, which have no tag yet.)
          TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          while grep -qx "v$VERSION-$REV" <<< "$TAGS"; do REV=$((REV + 1)); done
          BUILD=false
          if [ "$REV" = 1 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then BUILD=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-$REV" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Firefox $VERSION, tag v$VERSION-$REV, build: $BUILD"

  test:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get the newest Astrelle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From the API, which lists drafts too (new releases start as drafts, with no tag yet).
          ASSET=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq '[.[] | .assets[] | select(.name | endswith("-linux-x86_64.tar.xz"))][0].url')
          test -n "$ASSET" || { echo "No Astrelle release to test on" >&2; exit 1; }
          gh api -H "Accept: application/octet-stream" "$ASSET" > "$RUNNER_TEMP/astrelle.tar.xz"
          tar -xJf "$RUNNER_TEMP/astrelle.tar.xz" -C "$RUNNER_TEMP"
          # With this commit's interface, as a build of it would ship (its startup settings and
          # policies too, not only the scripts the tests point it at).
          scripts/install_ui.sh "$RUNNER_TEMP/aether"
          "$RUNNER_TEMP/aether/aether" --version

      - name: Test the interface
        env:
          AETHER_BIN: ${{ runner.temp }}/aether/aether
        run: python3 tools/test.py -j 3

  linux:
    needs: [check, test]
    if: needs.check.outputs.build == 'true' && !inputs.tests_only
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      # A Firefox build can briefly need more than the machine's 16 GB; without swap the
      # compile gets killed partway (exit code 143). Ubuntu's systemd-oomd also kills big
      # builds under memory pressure, so it's stopped for the build.
      - name: Add swap and stop the low-memory killer
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          free -h

      - name: Get Firefox source and apply our changes
        run: scripts/prepare.sh "${{ needs.check.outputs.version }}"

      - name: Build
        working-directory: src
        env:
          MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
          MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: pip
          GOOGLE_SAFEBROWSING_KEY: ${{ secrets.GOOGLE_SAFEBROWSING_KEY }}
        run: |
          # Google's Safe Browsing key, so the phishing and malware lists download (without it they never do).
          if [ -n "$GOOGLE_SAFEBROWSING_KEY" ]; then
            printf '%s' "$GOOGLE_SAFEBROWSING_KEY" | tr -d '[:space:]' > ../safebrowsing.key
            echo "ac_add_options --with-google-safebrowsing-api-keyfile=$PWD/../safebrowsing.key" >> mozconfig
          fi
          # Memory use once a minute, shown if the build fails.
          ( while true; do echo "$(date -u +%T) $(free -m | awk '/Mem/ {print "mem used " $3 " MB"} /Swap/ {print "swap used " $3 " MB"}' | paste -sd' ')"; sleep 60; done ) > ../memory.log 2>&1 &
          ./mach --no-interactive configure
          # Astrelle's own profile folder (prepare.sh): checked here, minutes in, not after hours.
          grep -q "MOZ_APP_PROFILE.*astrelle" obj/config.status || { echo "MOZ_APP_PROFILE isn't astrelle" >&2; exit 1; }
          ./mach --no-interactive build
          ./mach package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source release.env
          FILE=$(ls src/obj/dist/"$APP_NAME"-*.tar.* | head -n1)
          # Add Astrelle's interface layer (ui/) to the packaged browser.
          mkdir pkg
          tar -xf "$FILE" -C pkg
          scripts/install_ui.sh "pkg/$APP_NAME"
          XZ_OPT=-T0 tar -cJf "$APP_NAME-${{ needs.check.outputs.version }}-linux-x86_64.tar.xz" -C pkg "$APP_NAME"
          # A draft: only the repo's owner sees it until it's published by hand.
          gh release create "${{ needs.check.outputs.tag }}" "$APP_NAME"-*-linux-x86_64.tar.xz --draft \
            --title "${{ needs.check.outputs.tag }}" \
            --notes "Built on Firefox ${{ needs.check.outputs.version }}."

      - name: Show disk, memory and kills if the build failed
        if: failure()
        run: |
          df -h /
          tail -n 15 memory.log || true
          sudo dmesg | grep -iE "out of memory|oom|killed process" | tail -n 10 || true
          journalctl -u systemd-oomd --no-pager 2>/dev/null | tail -n 10 || true
